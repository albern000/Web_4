<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Sandi — Akses Militer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
        }

        /* Tema Abu Tentara */
        :root {
            --abu-gelap: #2c2f33;
            --abu-tengah: #4a4e54;
            --abu-terang: #7c8289;
            --abu-logam: #b0b6bc;
            --khaki: #9a886f;
            --hitam: #181a1d;
            --teks: #e2e4e7;
        }

        body {
            background: linear-gradient(135deg, var(--abu-gelap), var(--hitam));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .kotak-kunci {
            background: linear-gradient(160deg, var(--abu-tengah), var(--abu-gelap));
            border: 3px solid var(--abu-terang);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .kotak-kunci h2 {
            color: var(--abu-logam);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--khaki);
            padding-bottom: 0.5rem;
        }

        .kotak-kunci p {
            color: #a0a6ad;
            margin-bottom: 1.5rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 1.2rem;
            background: var(--hitam);
            border: 2px solid var(--abu-terang);
            color: var(--teks);
            font-size: 1.1rem;
            text-align: center;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--khaki);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: var(--abu-gelap);
            border: 2px solid var(--khaki);
            color: var(--teks);
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: var(--abu-tengah);
            box-shadow: 0 0 12px rgba(154,136,111,0.3);
        }

        #pesan {
            margin-top: 1rem;
            font-weight: bold;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="kotak-kunci">
        <h2>Verifikasi Akses</h2>
        <p>Masukkan sandi yang diberikan admin</p>
        <input type="password" id="inputSandi" placeholder="Ketik sandi di sini...">
        <button onclick="cekSandi()">Konfirmasi</button>
        <div id="pesan"></div>
    </div>

    <script>
        // Ubah sandi di sini
        const sandiBenar = "adminbaikhati";

        function cekSandi() {
            const input = document.getElementById("inputSandi").value;
            const zonaPesan = document.getElementById("pesan");

            if (input === sandiBenar) {
                zonaPesan.textContent = "✅ Akses Diterima!";
                zonaPesan.style.color = "#8fbc8f";
                // Ganti dengan halaman tujuanmu, misal:
                setTimeout(() => {
                    window.location.href = "webb.html";
                }, 1200);
            } else {
                zonaPesan.textContent = "❌ Kode Salah! Coba lagi.";
                zonaPesan.style.color = "#cd5c5c";
                document.getElementById("inputSandi").value = "";
            }
        }

        // Bisa tekan tombol Enter
        document.getElementById("inputSandi").addEventListener("keyup", function(e) {
            if (e.key === "Enter") cekSandi();
        });
    </script>

</body>
</html>
